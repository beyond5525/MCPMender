<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCPMender Handbook</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111e;
      --panel: #101f35;
      --panel-2: #142842;
      --line: rgba(161, 195, 235, .16);
      --text: #edf6ff;
      --muted: #91a9c5;
      --accent: #59e3ce;
      --blue: #70a9ff;
      --amber: #f6c66d;
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei",
        "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0, rgba(36, 117, 179, .25), transparent 28rem),
        radial-gradient(circle at 90% 8%, rgba(52, 212, 183, .12), transparent 24rem),
        var(--bg);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, pre { font-family: "Cascadia Code", Consolas, monospace; }
    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 880px);
      width: min(1240px, calc(100% - 48px));
      margin: 0 auto;
      gap: 42px;
    }
    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 34px 0;
      overflow: auto;
      border-right: 1px solid var(--line);
    }
    main { padding: 54px 0 100px; }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .logo {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border: 1px solid rgba(89, 227, 206, .35);
      border-radius: 13px;
      background: rgba(89, 227, 206, .1);
      color: var(--accent);
      font-weight: 900;
      box-shadow: 0 0 30px rgba(89, 227, 206, .12);
    }
    .brand > div { min-width: 0; }
    .brand strong, .brand small { display: block; }
    .brand strong, .brand small { overflow-wrap: anywhere; }
    .brand small { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .language, .print-button {
      width: calc(100% - 28px);
      padding: 10px 12px;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
    }
    .language { margin-bottom: 10px; }
    .print-button {
      margin-bottom: 26px;
      cursor: pointer;
    }
    .print-button:hover { border-color: rgba(89, 227, 206, .45); }
    nav { padding-right: 28px; }
    nav a {
      display: block;
      padding: 9px 11px;
      color: var(--muted);
      border-radius: 8px;
      font-size: 13px;
    }
    nav a:hover, nav a.active {
      color: var(--text);
      background: rgba(112, 169, 255, .1);
      text-decoration: none;
    }
    .side-note {
      margin: 26px 28px 0 0;
      padding: 14px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.55;
      background: rgba(255, 255, 255, .02);
    }
    .hero {
      padding: 38px;
      border: 1px solid rgba(89, 227, 206, .2);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(21, 48, 72, .88), rgba(12, 26, 45, .74));
      box-shadow: 0 30px 90px rgba(0, 0, 0, .22);
    }
    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
    }
    h1 {
      max-width: 720px;
      margin: 12px 0;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.03;
      letter-spacing: -.045em;
    }
    .hero p {
      max-width: 720px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }
    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 24px;
    }
    .pill {
      padding: 7px 10px;
      color: var(--accent);
      border: 1px solid rgba(89, 227, 206, .18);
      border-radius: 999px;
      background: rgba(89, 227, 206, .06);
      font-size: 11px;
      font-weight: 700;
    }
    section {
      padding-top: 64px;
      scroll-margin-top: 24px;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 28px;
      letter-spacing: -.025em;
    }
    h3 { margin: 30px 0 10px; color: #dceaff; font-size: 17px; }
    p, li { color: #c5d5e8; line-height: 1.75; }
    li + li { margin-top: 7px; }
    .lead { color: var(--muted); font-size: 15px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .card, .callout, details {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(20, 40, 67, .8), rgba(12, 27, 47, .7));
    }
    .card { padding: 19px; }
    .card strong { display: block; margin-bottom: 7px; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; }
    .steps {
      margin: 22px 0;
      padding: 0;
      list-style: none;
      counter-reset: steps;
    }
    .steps li {
      position: relative;
      min-height: 46px;
      padding: 4px 0 22px 54px;
      counter-increment: steps;
    }
    .steps li::before {
      position: absolute;
      left: 0;
      top: 0;
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      content: counter(steps);
      color: #06231f;
      border-radius: 10px;
      background: var(--accent);
      font-weight: 900;
    }
    pre {
      margin: 15px 0;
      padding: 18px;
      overflow: auto;
      color: #d8f7f1;
      border: 1px solid rgba(89, 227, 206, .16);
      border-radius: 12px;
      background: #07101b;
      line-height: 1.6;
    }
    .callout {
      margin: 20px 0;
      padding: 18px 20px;
      border-left: 3px solid var(--accent);
    }
    .callout.warning { border-left-color: var(--amber); }
    .callout strong { display: block; margin-bottom: 5px; }
    .callout p { margin: 0; color: var(--muted); }
    table {
      width: 100%;
      margin: 18px 0;
      border-collapse: collapse;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    th, td {
      padding: 13px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--muted); background: rgba(255, 255, 255, .025); font-size: 12px; }
    td { color: #c9d9eb; font-size: 13px; }
    details { margin: 10px 0; padding: 0 17px; }
    summary { padding: 16px 0; cursor: pointer; font-weight: 700; }
    details p { margin-top: 0; color: var(--muted); }
    footer {
      margin-top: 80px;
      padding-top: 24px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 12px;
    }
    @media (max-width: 860px) {
      .layout { display: block; width: min(100% - 28px, 760px); }
      aside {
        position: relative;
        height: auto;
        padding-bottom: 18px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      nav { display: none; }
      .language, .print-button { width: 100%; }
      .side-note { margin-right: 0; }
      main { padding-top: 28px; }
      .cards { grid-template-columns: 1fr; }
      .hero { padding: 26px; }
    }
    @media print {
      :root { color-scheme: light; }
      body { color: #111; background: #fff; }
      aside { display: none; }
      .layout { display: block; width: 100%; }
      main { padding: 0; }
      .hero, .card, .callout, details { color: #111; background: #fff; box-shadow: none; }
      p, li, td, .lead, .hero p, .card p, .callout p, details p { color: #333; }
      section { break-inside: avoid; }
      pre { color: #111; background: #f5f5f5; white-space: pre-wrap; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand">
        <span class="logo">M</span>
        <div><strong>MCPMender · 协议修匠</strong><small id="edition"></small></div>
      </div>
      <select id="language" class="language" aria-label="Language">
        <option value="en">English</option>
        <option value="zh-CN">简体中文</option>
        <option value="ja">日本語</option>
      </select>
      <button id="print-book" class="print-button">Print / Save PDF</button>
      <nav id="toc"></nav>
      <div class="side-note" id="side-note"></div>
    </aside>
    <main id="content"></main>
  </div>
  <script>
    const handbook = {
      en: {
        edition: "Offline Handbook · 0.3.0-beta.5",
        printLabel: "Print / Save PDF",
        sideNote: "This handbook is included with MCPMender and works completely offline. Use your browser’s Print command to save the current language as PDF.",
        hero: {
          eyebrow: "GET STARTED WITH CONFIDENCE",
          title: "Understand, diagnose, and safely repair MCP connections",
          text: "MCPMender helps Codex, Claude, Cursor, VS Code, VSCodium, Gemini CLI, and OpenCode connect to local and remote MCP tools. This guide explains every important workflow without assuming prior MCP knowledge.",
          pills: ["Windows · macOS · Linux", "CLI + Desktop", "Local only", "English · 中文 · 日本語"]
        },
        sections: [
          {
            id: "understand", title: "1. What MCPMender does", lead: "Think of MCP as a plug that lets an AI developer tool use GitHub, browsers, databases, and local utilities. MCPMender is the connection doctor for that plug.",
            html: `<div class="cards">
              <div class="card"><strong>Discover</strong><p>Find installed AI tool configurations without creating or changing them.</p></div>
              <div class="card"><strong>Diagnose</strong><p>Explain path, command, environment, syntax, and connection problems in plain language.</p></div>
              <div class="card"><strong>Repair safely</strong><p>Preview deterministic low-risk fixes, back up the original, apply, and verify.</p></div>
              <div class="card"><strong>Share evidence</strong><p>Export a redacted report for maintainers or support without exposing common secrets.</p></div>
            </div>
            <div class="callout"><strong>What MCPMender is not</strong><p>It is not an AI chat client, an MCP marketplace, or a background cloud service. It runs locally when you ask it to.</p></div>`
          },
          {
            id: "quick-start", title: "2. Five-minute quick start", lead: "The Desktop is the easiest route. The CLI offers the same core behavior for terminal users and automation.",
            html: `<h3>Desktop</h3><ol class="steps">
              <li>Download the package for your operating system and open MCPMender.</li>
              <li>Choose your language in the top-right corner. The choice is remembered.</li>
              <li>Select a project folder when you want MCPMender to include supported project-level VS Code, Cursor, Codex, Gemini CLI, and OpenCode configuration.</li>
              <li>Select <strong>Scan now</strong>. The default scan is read-only.</li>
              <li>Review each client card and its green, yellow, or red result.</li>
              <li>When you need proof that a server can really start and speak MCP, select <strong>Deep connection check</strong>, review the commands, and confirm.</li>
              <li>If safe repairs are available, open the preview and confirm only after reviewing the before/after command.</li>
            </ol>
            <h3>CLI</h3><p>Install Node.js 20.3 or later. Download <code>CLI/mcpmender-0.3.0-beta.5.tgz</code> from the release archive, open a terminal in that directory, and run <code>npm install --global ./mcpmender-0.3.0-beta.5.tgz</code>. The <code>mcpmender@beta</code> registry command becomes available only after an npm beta is officially announced.</p><pre>mcpmender scan
mcpmender scan --lang zh-CN
mcpmender scan --lang ja
mcpmender scan --json
mcpmender probe
mcpmender probe --run</pre>`
          },
          {
            id: "desktop", title: "3. Desktop interface", lead: "The dashboard keeps diagnosis understandable even if you do not normally use a terminal.",
            html: `<table><thead><tr><th>Area</th><th>Purpose</th></tr></thead><tbody>
              <tr><td>Summary cards</td><td>Show detected clients, configured servers, problems, and safe repairs.</td></tr>
              <tr><td>Client cards</td><td>Show the exact configuration path, server count, status, and findings for each supported AI tool.</td></tr>
              <tr><td>Select project folder</td><td>Adds supported VS Code, Cursor, Codex, Gemini CLI, and OpenCode project configuration locations to the scan scope. MCPMender never guesses from the portable EXE extraction folder.</td></tr>
              <tr><td>Scan now</td><td>Repeats a read-only discovery and static validation pass.</td></tr>
              <tr><td>Deep connection check</td><td>After confirmation, starts or contacts targets with per-target progress. Cancel stops new targets and safely waits for at most two active checks to reach their timeout.</td></tr>
              <tr><td>Repair safe issues</td><td>Opens a before/after preview. It does not write immediately.</td></tr>
              <tr><td>Backup history</td><td>Offers rollback only while the current file still matches the repaired version.</td></tr>
              <tr><td>Export report</td><td>Creates a structured JSON report with home paths and common token patterns redacted.</td></tr>
              <tr><td>Tutorial & help</td><td>Opens this offline handbook in a separate MCPMender window.</td></tr>
            </tbody></table>`
          },
          {
            id: "statuses", title: "4. Reading scan results", lead: "A color is a decision aid, not a security verdict.",
            html: `<table><thead><tr><th>Status</th><th>Meaning</th><th>What to do</th></tr></thead><tbody>
              <tr><td>Green · Healthy</td><td>No known problem was found by the checks that ran.</td><td>Use Deep connection check when you also need to verify server startup and the MCP handshake.</td></tr>
              <tr><td>Yellow · Needs attention</td><td>A common compatibility risk was found.</td><td>Read the explanation and preview any offered fix.</td></tr>
              <tr><td>Red · Problem found</td><td>The configuration is invalid or incomplete.</td><td>Do not force an automatic repair unless MCPMender explicitly marks one safe.</td></tr>
              <tr><td>Gray · Not configured</td><td>No supported configuration file was found at the checked path.</td><td>This is normal if you do not use that client.</td></tr>
            </tbody></table>
            <div class="callout warning"><strong>Important</strong><p>“Healthy” means the performed checks passed. It does not prove that a third-party server is trustworthy or that an account is authorized.</p></div>`
          },
          {
            id: "repair", title: "5. One-click repair, backup, and rollback", lead: "One-click repair is deliberately limited to deterministic changes with a clear expected result.",
            html: `<ol class="steps">
              <li>MCPMender scans the file and records its content hash.</li>
              <li>You see the exact command before and after the proposed repair.</li>
              <li>When confirmed, MCPMender checks that the file did not change after the scan.</li>
              <li>The original content is written to a uniquely named local transaction backup.</li>
              <li>The change is validated in a temporary file and committed atomically only if the source still matches.</li>
              <li>Backup history offers rollback, but refuses to overwrite later edits.</li>
            </ol>
            <h3>CLI repair commands</h3><pre>mcpmender repair
mcpmender repair --apply-safe</pre>
            <div class="callout warning"><strong>Never treat “one click” as “blind trust”</strong><p>Credentials, enterprise policy, firewall changes, remote outages, and unknown server behavior require user or administrator decisions and should not be auto-fixed.</p></div>`
          },
          {
            id: "cli", title: "6. Command-line reference", lead: "The CLI is useful on developer machines, remote systems, CI, and support sessions.",
            html: `<table><thead><tr><th>Command</th><th>Result</th></tr></thead><tbody>
              <tr><td><code>mcpmender scan</code></td><td>Human-readable local scan.</td></tr>
              <tr><td><code>mcpmender scan --json</code></td><td>Machine-readable, redacted report.</td></tr>
              <tr><td><code>mcpmender scan --lang en</code></td><td>English output.</td></tr>
              <tr><td><code>mcpmender scan --lang zh-CN</code></td><td>Simplified Chinese output.</td></tr>
              <tr><td><code>mcpmender scan --lang ja</code></td><td>Japanese output.</td></tr>
              <tr><td><code>mcpmender probe</code></td><td>Preview every command or remote endpoint that a deep check would use. Nothing is started.</td></tr>
              <tr><td><code>mcpmender probe --run</code></td><td>Perform real MCP initialize handshakes with an 8-second timeout and guaranteed connection cleanup.</td></tr>
              <tr><td><code>mcpmender probe --run --server name</code></td><td>Deep-check only one named server.</td></tr>
              <tr><td><code>mcpmender repair</code></td><td>Show safe repair proposals without writing.</td></tr>
              <tr><td><code>mcpmender repair --apply-safe</code></td><td>Back up and apply eligible safe repairs.</td></tr>
            </tbody></table>
            <p>Exit codes: <code>0</code> success, <code>1</code> invalid input or runtime failure, <code>2</code> scan/probe failure, and <code>3</code> skipped or failed repair.</p>`
          },
          {
            id: "privacy", title: "7. Privacy and security", lead: "MCP configurations may contain sensitive paths and credentials. MCPMender is designed to minimize unnecessary exposure.",
            html: `<ul>
              <li>No account, telemetry, or MCPMender cloud service is required.</li>
              <li>The default scan reads known configuration locations locally.</li>
              <li>Exported reports replace the user home path and common token shapes.</li>
              <li>Backups remain local and may still contain original secrets; protect them like the source configuration.</li>
              <li>MCPMender does not claim that a discovered MCP server is safe.</li>
              <li>In Desktop, Deep connection check always shows a preview and requires confirmation. In the CLI, <code>probe --run</code> is the explicit authorization and reads the current configuration again immediately before running. Configured commands can execute third-party code and <code>npx</code> may download packages.</li>
              <li>Every deep check has a timeout and closes its process or HTTP connection when finished.</li>
            </ul>
            <div class="callout"><strong>Before sharing a report</strong><p>Open it and perform a final human review. No automated redactor can guarantee detection of every custom secret format.</p></div>`
          },
          {
            id: "platforms", title: "8. Windows, macOS, Linux, and WSL", lead: "The core concepts are shared, but process launching and configuration paths differ.",
            html: `<table><thead><tr><th>Platform</th><th>Common concern</th></tr></thead><tbody>
              <tr><td>Windows</td><td>Extract the archive and run the portable <code>.exe</code>; no installation is required. When the folder is writable, settings, cache, logs, and backups stay in the adjacent <code>data</code> folder; otherwise the interface shows the fallback location. A beta self-signed signature is not automatically trusted by Windows or SmartScreen.</td></tr>
              <tr><td>macOS</td><td>Choose the Apple Silicon or Intel package, open the DMG, and move MCPMender to Applications. A beta ad-hoc signature does not establish developer identity, is not trusted by Gatekeeper, and may require explicit approval in Privacy &amp; Security after checksum verification.</td></tr>
              <tr><td>Linux</td><td>Make the AppImage executable with <code>chmod +x</code> and run it, or extract the tar.gz and run <code>mcpmender</code>. Missing shared libraries vary by distribution.</td></tr>
              <tr><td>WSL</td><td>Do not mix a Windows executable with a Linux path, or a Linux executable with an unconverted Windows path.</td></tr>
            </tbody></table>
            <div class="callout warning"><strong>AppImage cannot start without FUSE?</strong><p>Use the AppImage's built-in extract-and-run fallback:</p><pre>APPIMAGE_EXTRACT_AND_RUN=1 ./MCPMender*.AppImage</pre><p>This only changes how the AppImage is launched. It does not repair MCP configuration, and it does not require <code>sudo</code> or root access.</p></div>
            <div class="callout"><strong>CLI on every platform</strong><p>Install the CLI package with Node.js 20.3 or later. Desktop and CLI do not need to stay running in the background. Native CI is designed to start the final artifacts on their target operating systems, but the release notes are authoritative about which jobs and manual checks actually passed. Verify the checksum shown on the release page before opening a downloaded package.</p></div>`
          },
          {
            id: "reports", title: "9. Reports and asking for help", lead: "A useful support report describes what was checked, what failed, and what changed—without casually exposing secrets.",
            html: `<h3>Include</h3><ul>
              <li>MCPMender version, operating system, and affected client.</li>
              <li>The redacted JSON report.</li>
              <li>The exact user-visible error and whether the server works in another client.</li>
              <li>Whether the problem started after a client, runtime, or server update.</li>
            </ul>
            <h3>Do not include</h3><ul>
              <li>Unredacted API keys, OAuth tokens, cookies, passwords, or private repository URLs.</li>
              <li>A complete private configuration unless the recipient is authorized and the transfer method is secure.</li>
            </ul>`
          },
          {
            id: "faq", title: "10. Frequently asked questions", lead: "Quick answers to the questions most users encounter first.",
            html: `<details open><summary>Does MCPMender modify my files during Scan?</summary><p>No. Scan is read-only. A file is changed only after you open a repair preview and explicitly confirm an eligible repair.</p></details>
            <details><summary>Why does Scan finish without proving the server works?</summary><p>Scan checks files, syntax, commands, environment references, and URLs without running third-party code. Use Deep connection check when you explicitly want MCPMender to start or contact the configured server and perform a real handshake.</p></details>
            <details><summary>Why is a client shown as Not configured?</summary><p>MCPMender did not find a supported configuration file at its known location. This is normal when the client is not installed or has never configured MCP.</p></details>
            <details><summary>Can MCPMender create or recover my token?</summary><p>No. It can identify that a required environment variable is absent, but authentication remains with the relevant provider.</p></details>
            <details><summary>Can every problem be repaired automatically?</summary><p>No. Safe repair is reserved for deterministic configuration transformations. Remote outages, permissions, enterprise policies, credentials, and server bugs require manual action.</p></details>
            <details><summary>Why did a repair get skipped?</summary><p>The configuration may have changed after scanning. MCPMender uses a content hash to avoid overwriting newer user or application changes.</p></details>
            <details><summary>Can I use the CLI and Desktop together?</summary><p>Yes. They use the same core scan and repair model. Re-scan after changes made by either interface.</p></details>
            <details><summary>Does MCPMender run in the background?</summary><p>No background service is required for normal use. The program runs when opened or invoked.</p></details>
            <details><summary>Why does the operating system warn about the app signature?</summary><p>Beta Windows builds may be self-signed, and beta macOS builds may use ad-hoc signing. Neither establishes a publisher identity trusted automatically by the operating system. Compare the published SHA-256 checksum and proceed only if you trust the release source.</p></details>
            <details><summary>How do I upgrade?</summary><p>Close MCPMender, keep a copy of the adjacent <code>data</code> directory, and extract the new release into a new folder. Start the new version and complete a scan before removing the old program folder. Keep repair backups until the repaired servers have worked with the new version.</p></details>
            <details><summary>How do I uninstall it?</summary><p>Before closing MCPMender, check the exact data path shown in the interface. A writable portable folder uses the adjacent <code>data</code> directory; a read-only folder uses the displayed fallback location. Close MCPMender, delete the program folder, and delete the recorded data path only if you also want to erase language preferences, logs, and rollback backups. If the program was already removed, extract and run the same release once more to display the fallback path. For the CLI, run <code>npm uninstall --global mcpmender</code>. Uninstalling MCPMender does not delete MCP configuration files owned by supported clients.</p></details>
            <details><summary>Can I print this handbook?</summary><p>Yes. Switch to the desired language and use your browser’s Print or Save as PDF command.</p></details>`
          },
          {
            id: "habits", title: "11. Recommended habits", lead: "Small habits keep MCP configurations easier to understand and recover.",
            html: `<ul>
              <li>Keep tokens in environment variables or the client’s approved credential flow instead of hard-coding them.</li>
              <li>Scan after changing Node, Python, uv, client versions, or moving a project.</li>
              <li>Review a repair preview even when it is marked safe.</li>
              <li>Keep backups until the repaired server has worked in a real session.</li>
              <li>Test one failing server at a time so the diagnosis stays bounded.</li>
              <li>Update MCPMender before filing a compatibility report.</li>
            </ul>`
          },
          {
            id: "glossary", title: "12. Plain-language glossary", lead: "A few terms make MCP troubleshooting much easier.",
            html: `<table><thead><tr><th>Term</th><th>Meaning</th></tr></thead><tbody>
              <tr><td>MCP</td><td>A protocol that lets an AI host communicate with external tool servers.</td></tr>

      document.title = `MCPMender — ${book.edition}`;
      select.value = locale;
      edition.textContent = book.edition;
      sideNote.textContent = book.sideNote;
      printButton.textContent = book.printLabel;
      toc.innerHTML = book.sections
        .map(section => `<a href="#${section.id}">${section.title}</a>`)
        .join("");
      content.innerHTML = `
        <article class="hero">
          <span class="eyebrow">${book.hero.eyebrow}</span>
          <h1>${book.hero.title}</h1>
          <p>${book.hero.text}</p>
          <div class="hero-meta">${book.hero.pills.map(pill => `<span class="pill">${pill}</span>`).join("")}</div>
        </article>
        ${book.sections.map(section => `
          <section id="${section.id}">
            <h2>${section.title}</h2>
            <p class="lead">${section.lead}</p>
            ${section.html}
          </section>`).join("")}
        <footer>${book.footer}</footer>`;

      const links = [...toc.querySelectorAll("a")];
      const observer = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            links.forEach(link => link.classList.toggle("active", link.hash === `#${entry.target.id}`));
          }
        }
      }, { rootMargin: "-20% 0px -70% 0px" });
      document.querySelectorAll("main section").forEach(section => observer.observe(section));
    }

    const requestedLocale = new URLSearchParams(window.location.search).get("lang");
    const initial = normalize(requestedLocale || localStorage.getItem("mcpmender.handbook.locale") || navigator.language);
    if (requestedLocale) {
      localStorage.setItem("mcpmender.handbook.locale", initial);
    }
    select.addEventListener("change", () => {
      const locale = normalize(select.value);
      localStorage.setItem("mcpmender.handbook.locale", locale);
      render(locale);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    printButton.addEventListener("click", () => window.print());
    render(initial);
  </script>
</body>
</html>
